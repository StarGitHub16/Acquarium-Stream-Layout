<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Gelid Genteel — Arctic Undersea Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <svg style="position: absolute; width: 0; height: 0;">
      <defs>
        <filter id="iceCrystal">
          <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="1" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="frostGlow">
          <feGaussianBlur stdDeviation="2" result="coloredBlur" />
          <feMerge>
            <feMergeNode in="coloredBlur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>
    </svg>
  </head>
  <body>
    <main class="overlay" aria-label="The GelidGenteel arctic undersea Twitch overlay">
      <div class="ambient-glow glow-a"></div>
      <div class="ambient-glow glow-b"></div>
      <div class="starfield" aria-hidden="true"></div>
      <div class="bioluminescent-glow bio-1"></div>
      <div class="bioluminescent-glow bio-2"></div>
      <div class="bioluminescent-glow bio-3"></div>
      
      <!-- Steam/mist effects for thawing states -->
      <div class="steam-mist steam-1" aria-hidden="true"></div>
      <div class="steam-mist steam-2" aria-hidden="true"></div>
      <div class="steam-mist steam-3" aria-hidden="true"></div>
      
      <!-- Coral formations -->
      <div class="coral coral-1" aria-hidden="true"></div>
      <div class="coral coral-2" aria-hidden="true"></div>
      <div class="coral coral-3" aria-hidden="true"></div>
      <div class="coral coral-4" aria-hidden="true"></div>
      
      <!-- Seaweed/algae on sides -->
      <div class="seaweed seaweed-left-1" aria-hidden="true"></div>
      <div class="seaweed seaweed-left-2" aria-hidden="true"></div>
      <div class="seaweed seaweed-left-3" aria-hidden="true"></div>
      <div class="seaweed seaweed-right-1" aria-hidden="true"></div>
      <div class="seaweed seaweed-right-2" aria-hidden="true"></div>
      <div class="seaweed seaweed-right-3" aria-hidden="true"></div>
      
      <!-- Swimming fish container -->
      <div class="fish-container" aria-hidden="true"></div>
      
      <!-- Floating octopus on borders -->
      <div class="octopus octopus-left" aria-hidden="true">
        <div class="octopus-head"></div>
        <div class="tentacle tentacle-1"></div>
        <div class="tentacle tentacle-2"></div>
        <div class="tentacle tentacle-3"></div>
        <div class="tentacle tentacle-4"></div>
        <div class="octopus-eye octopus-eye-left"></div>
        <div class="octopus-eye octopus-eye-right"></div>
      </div>
      
      <div class="octopus octopus-right" aria-hidden="true">
        <div class="octopus-head"></div>
        <div class="tentacle tentacle-1"></div>
        <div class="tentacle tentacle-2"></div>
        <div class="tentacle tentacle-3"></div>
        <div class="tentacle tentacle-4"></div>
        <div class="octopus-eye octopus-eye-left"></div>
        <div class="octopus-eye octopus-eye-right"></div>
      </div>
      
      <!-- Floating crabs on borders -->
      <div class="crab crab-bottom-left" aria-hidden="true">
        <div class="crab-body"></div>
        <div class="claw claw-left"></div>
        <div class="claw claw-right"></div>
        <div class="leg leg-1"></div>
        <div class="leg leg-2"></div>
        <div class="leg leg-3"></div>
        <div class="leg leg-4"></div>
        <div class="crab-eye crab-eye-left"></div>
        <div class="crab-eye crab-eye-right"></div>
      </div>
      
      <div class="crab crab-top-right" aria-hidden="true">
        <div class="crab-body"></div>
        <div class="claw claw-left"></div>
        <div class="claw claw-right"></div>
        <div class="leg leg-1"></div>
        <div class="leg leg-2"></div>
        <div class="leg leg-3"></div>
        <div class="leg leg-4"></div>
        <div class="crab-eye crab-eye-left"></div>
        <div class="crab-eye crab-eye-right"></div>
      </div>

      <section class="gameplay-frame" aria-label="Gameplay safe area">
        <div class="ice-edge edge-top"></div>
        <div class="ice-edge edge-right"></div>
        <div class="ice-edge edge-bottom"></div>
        <div class="ice-edge edge-left"></div>
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-br"></div>
        <div class="corner corner-bl"></div>
        <div class="inner-rim"></div>
        <div class="card-iframe-host" id="card-iframe-host" aria-live="polite">
          <iframe class="card-frame" data-card-page="card-thawing.html" src="card-thawing.html" title="Thawing stream card" tabindex="-1" allowtransparency="true"></iframe>
          <iframe class="card-frame" data-card-page="card-frozen.html" src="card-frozen.html" title="Frozen stream card" tabindex="-1" allowtransparency="true"></iframe>
          <iframe class="card-frame" data-card-page="card-offline.html" src="card-offline.html" title="Offline stream card" tabindex="-1" allowtransparency="true"></iframe>
        </div>
        
        <!-- Center-card content now loads from separate HTML pages through #card-iframe-host. -->
        <div class="center-message offline-message" aria-hidden="true">

          </div>

      <div class="shard shard-a" aria-hidden="true"></div>
      <div class="shard shard-b" aria-hidden="true"></div>
      <div class="shard shard-c" aria-hidden="true"></div>
      <div class="ice-formation ice-top-left"></div>
      <div class="ice-formation ice-top-right"></div>
      <div class="ice-formation ice-bottom-left"></div>
      <div class="ice-formation ice-bottom-right"></div>
      
      <!-- Glacier formations for frozen state -->
      <div class="glacier glacier-main" aria-hidden="true"></div>
      <div class="glacier glacier-secondary" aria-hidden="true"></div>
      <div class="ice-crack crack-1" aria-hidden="true"></div>
      <div class="ice-crack crack-2" aria-hidden="true"></div>
      <div class="ice-crack crack-3" aria-hidden="true"></div>
      <div class="frost-overlay" aria-hidden="true"></div>

      <nav class="demo-controls" aria-label="Overlay preview controls">
        <div class="control-group" aria-label="Animations">
          <span class="control-label">WEATHER</span>
          <button data-animation="standard">Normal</button>
          <button data-animation="thawing" data-animation-toggle="true">Bubbles</button>
          <button data-animation="frozen" data-animation-toggle="true">Freeze</button>
          <button data-animation="frigid" data-animation-toggle="true">Deep Freeze</button>
        </div>
        <div class="control-group" aria-label="Cards with animations">
          <span class="control-label">CARD + WEATHER</span>
          <button data-card="card-thawing.html" data-animation="thawing" data-card-duration="manual" data-card-toggle="true">Thawing Card</button>
          <button data-card="card-frozen.html" data-animation="frozen" data-card-duration="manual" data-card-toggle="true">Frozen Card</button>
          <button data-card="card-offline.html" data-animation="frigid" data-card-duration="manual" data-card-toggle="true">Offline Card</button>
        </div>
      </nav>
    </main>
    <script src="script.js"></script>
