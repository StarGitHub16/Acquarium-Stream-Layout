<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Identity Plaque Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="identity-plaque.css" />
    <svg style="position: absolute; width: 0; height: 0;">
      <defs>
        <filter id="iceCrystal">
          <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="1" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
  </head>
  <body>
    <div class="identity-plaque">
      <div class="crest" aria-hidden="true"><span>🧊</span></div>
      <div>
        <p class="eyebrow ice-font"></p>
        <h1>THEGELIDGENTEEL</h1>
        <p class="subtitle ice-font" id="current-game">Currently Playing:</p>
      </div>
      <div class="frost-crystal" style="top: 10px; right: 15px;"></div>
      <div class="frost-crystal" style="bottom: 8px; left: 12px; animation-delay: 1s;"></div>
      <div class="frost-crystal" style="top: 50%; right: 8px; animation-delay: 2s;"></div>
      <div class="edit-indicator" id="editIndicator">Press G to edit game</div>
    </div>
    <script src="identity-plaque.js"></script>
  </body>
</html>
