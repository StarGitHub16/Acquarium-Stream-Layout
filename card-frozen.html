<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frozen Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="center-card-pages.css?v=card-sheen-1" />
  </head>
  <body class="card-live">
    <main class="card-stage">
      <div class="card-page card-page--frozen" data-card-key="frozen">
        <div class="card-icon">❄️</div>
        <h1 data-card-title contenteditable="true" spellcheck="true">FROZEN</h1>
        <p data-card-subtitle contenteditable="true" spellcheck="true">TEMPORARILY FROZEN</p>
        <span class="card-edit-help">Click text to edit · Enter to save</span>
      </div>
    </main>
    <script src="overlay-relay.js"></script>
    <script>
      // Add control panel event listener for direct page access
      (() => {
        const controlEventKey = 'gelid-genteel-overlay-control';
        const controlChannel = 'BroadcastChannel' in window ? new BroadcastChannel('gelid-genteel-overlay-controls') : null;
        let knownControlEventId = null;

        function receiveControllerEvent(event) {
          if (!event?.id || event.id === knownControlEventId || event.type !== 'gelid-overlay-control') return;
          knownControlEventId = event.id;
          const control = event.control || {};
          const pageName = location.pathname.split('/').pop();
          
          // Show card if this page matches the control's card
          if (control.card === pageName) {
            document.body.classList.add('card-live');
            document.querySelector('.card-page')?.classList.add('is-live-active');
          } else {
            document.body.classList.remove('card-live');
            document.querySelector('.card-page')?.classList.remove('is-live-active');
          }
        }

        function readNewStoredControllerEvent() {
          try { 
            const stored = localStorage.getItem(controlEventKey);
            if (stored) receiveControllerEvent(JSON.parse(stored));
          } catch (_) {}
        }

        controlChannel && (controlChannel.onmessage = ({ data }) => receiveControllerEvent(data));
        window.addEventListener('storage', (event) => { if (event.key === controlEventKey && event.newValue) readNewStoredControllerEvent(); });
      })();
    </script>
    <script src="editable-card-page.js?v=live-card-2"></script>
  </body>
</html>
