<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thawing Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="center-card-pages.css" />
  </head>
  <body>
    <main class="card-stage">
      <div class="card-page card-page--thawing" data-card-key="thawing">
        <div class="card-icon">💧</div>
        <h1 data-card-title contenteditable="true" spellcheck="true">THAWING</h1>
        <p data-card-subtitle contenteditable="true" spellcheck="true">THE AQUARIUM OPENS SOON</p>
        <span class="card-edit-help">Click text to edit · Enter to save</span>
      </div>
    </main>
    <script src="editable-card-page.js"></script>
  </body>
</html>
