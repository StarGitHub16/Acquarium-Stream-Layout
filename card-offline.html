<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="center-card-pages.css?v=card-sheen-1" />
  </head>
  <body class="card-live">
    <main class="card-stage">
      <div class="card-page card-page--offline" data-card-key="offline">
        <div class="card-icon">🏔️</div>
        <h1 data-card-title contenteditable="true" spellcheck="true">TANK FREEZING</h1>
        <p data-card-subtitle contenteditable="true" spellcheck="true">THANKS FOR WATCHING</p>
        <span class="card-edit-help">Click text to edit · Enter to save</span>
      </div>
    </main>
    <script src="overlay-relay.js"></script>
    <script src="editable-card-page.js?v=live-card-2"></script>
  </body>
</html>
